[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom4ortho"
version = "0.5.4-dev"
description = "A DICOM Implementation for Orthodontic Images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Toni Magni", email = "amagni@open-ortho.org"},
]
keywords = ["DICOM", "VL", "Visible Light Photography", "Orthodontics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "argparse",
    "pydicom",
    "pynetdicom>=2,<3",
    "pillow>=9.2.0",
    "prettytable",
    "numpy",
    "urllib3>=1.26.5",
    "requests (>=2.32.4,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "wrapt",
    "pylint",
    "twine",
    "autopep8",
    "bumpversion",
    "pytest",
    "build",
    "rdflib"
]

[project.urls]
homepage = 'https://github.com/open-ortho/dicom4ortho'

[project.scripts]
dicom4ortho = "dicom4ortho.__main__:main"
d4o_generate = "dicom4ortho.__main__:generate_uid"

[tool.setuptools.package-data]
"*" = ["LICENSE"]
"dicom4ortho" = ["resources/views.csv"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["dicom4ortho*"]

[tool.pytest.ini_options]
testpaths = ["python/test"]
pythonpath = ["python", "."]
